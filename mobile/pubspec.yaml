name: localtransfer
description: LocalTransfer 移动客户端 —— 与桌面端（Rust+GPUI）互通的局域网文件/文本传输
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP 客户端（与桌面端 axum 服务互通）
  http: ^1.2.0
  # 本机 HTTP 服务（接收桌面端发来的消息/文件）
  shelf: ^1.6.0
  shelf_router: ^1.1.4
  # 文件选择（多选）
  file_picker: ^8.0.0
  # 下载目录定位
  path_provider: ^2.1.0
  # 设备指纹
  uuid: ^4.4.0
  # 设备名/指纹持久化
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
