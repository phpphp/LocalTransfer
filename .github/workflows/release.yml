name: build

# 三桌面平台原生构建。两种触发：
#   1. push tag v*        → 构建并发布 GitHub Release
#   2. 手动/推送 main 分支 → 只上传 artifacts 供下载
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  APP_NAME: LocalTransfer
  VERSION: 0.2.0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        run: cargo build --release
      - name: Package portable zip
        shell: pwsh
        run: |
          $dst = "${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64-windows"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item target/release/local-transfer.exe $dst/
          Copy-Item scripts/install.ps1 $dst/
          Copy-Item scripts/add-firewall-rule.ps1 $dst/
          Copy-Item assets/README.txt $dst/
          Compress-Archive -Path $dst -DestinationPath "$dst.zip" -Force
      - name: Build Inno installer
        shell: pwsh
        run: |
          # choco 安装的 ISCC 在 Program Files(x86)，且带 PATH shim
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer\localtransfer.iss
          # 挪到根目录，artifact/release 的 *.exe 通配才能匹配到
          Move-Item "dist/${{ env.APP_NAME }}-Setup-${{ env.VERSION }}-win64.exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64-windows
          path: |
            *.zip
            *.exe

  macos:
    strategy:
      matrix:
        include:
          - os: macos-14       # Apple Silicon
            target: aarch64-apple-darwin
          # Intel：macos-13 runner 已退役（任务永远排队），改在 ARM runner 交叉编译 x86_64
          - os: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (.app bundle)
        run: |
          chmod +x scripts/make-macos-app.sh
          ./scripts/make-macos-app.sh target/${{ matrix.target }}/release/local-transfer
          hdiutil create -volname "${{ env.APP_NAME }}" \
            -srcfolder dist/LocalTransfer.app \
            -ov -format UDZO "${{ env.APP_NAME }}-${{ env.VERSION }}-${{ matrix.target }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}-${{ matrix.target }}
          path: '*.dmg'

  linux:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            # aarch64 交叉编译在 ubuntu runner 上用 cross
            cross: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential zip pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libwayland-dev \
            libgl1 libegl1 libasound2-dev \
            libfontconfig1-dev libfreetype-dev
      - name: Install cross (aarch64)
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          dst="${{ env.APP_NAME }}-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir -p $dst
          cp target/${{ matrix.target }}/release/local-transfer $dst/
          cp assets/README.txt $dst/
          cp assets/icon.png $dst/
          cp assets/localtransfer.desktop $dst/
          tar czf "$dst.tar.gz" $dst
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}-${{ matrix.target }}
          path: '*.tar.gz'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.exe
            *.dmg
            *.tar.gz
