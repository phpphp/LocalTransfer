name: ios-check

# iOS 原生版类型检查（无 Xcode 工程，直接 swiftc -typecheck 对模拟器 SDK）。
# 本仓库无 macOS 构建环境——这一步是 iOS 代码唯一 自动验证手段。
on:
  push:
    branches: [main]
    paths: ['mobile/native-ios/**']
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Type-check Swift sources (iOS simulator target)
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc -typecheck \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0-simulator \
            mobile/native-ios/LocalTransfer/*.swift

      # 调试步：多播 API 在 iOS SDK 的真实形态（文档与 SDK 有出入时以此为准）
      - name: Dump NWMulticastGroup / requiredMulticastGroups interface
        if: always()
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          IFACE="$SDK/System/Library/Frameworks/Network.framework/Modules/Network.swiftmodule/arm64-apple-ios-simulator.swiftinterface"
          echo "==== NWGroupDescriptor 消费者 ===="
          grep -n "NWGroupDescriptor" "$IFACE" | head -20
          echo "==== NWMulticastGroup 类定义（1400-1460 行）===="
          sed -n '1400,1460p' "$IFACE"
          echo "==== requiredMulticastGroups ===="
          grep -n "requiredMulticastGroups" "$IFACE" || echo "(不存在)"
          echo "==== NWConnectionGroup 全部方法（1405-1580 行）===="
          sed -n '1460,1580p' "$IFACE" | grep -n "func \|init" | head -30
